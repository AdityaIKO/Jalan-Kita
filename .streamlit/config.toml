# Pinned theme so the app renders consistently regardless of the visitor's OS
# dark/light preference. Identity: warm "asphalt + safety-amber on paper".
[theme]
base = "light"
primaryColor = "#B5701A"            # safety amber (dark enough for white text)
backgroundColor = "#FAF7F2"         # warm paper
secondaryBackgroundColor = "#F1EBE1" # inputs, expanders, sidebar
textColor = "#241F18"               # warm near-black ink
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
# Cap uploads to match the image validator (utils.security.validate_image_upload).
maxUploadSize = 8
# XSRF protection guards form posts; CORS stays closed for a same-origin app.
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false
